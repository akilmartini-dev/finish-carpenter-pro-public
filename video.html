<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Video player · Finish Carpenter Pro</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #p { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; }
</style>
</head>
<body>
<!-- Plays one YouTube video in YouTube's own (privacy-enhanced) player for the Finish Carpenter Pro iPhone app.
     No tracking, no ads, no cookies of our own, nothing stored. -->
<div id="p"><div class="msg">Loading YouTube player…</div></div>
<script src="video.js"></script>
</body>
</html>
